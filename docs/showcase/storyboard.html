<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Flier Storyboard</title>
<style>
  :root { --accent: #8957e5; --dim: #9a9a9e; --faint: #6c6c71; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #111113; color: #fff; font: 14px/1.4 "Ubuntu Sans", system-ui, sans-serif; }
  .page { max-width: 1340px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .lede { color: var(--dim); margin: 0 0 18px; }
  iframe { width: 1300px; max-width: 100%; height: 860px; border: 0; display: block; margin-bottom: 26px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: #1c1c20; border: 1px solid #2c2c31; border-radius: 10px; padding: 14px 16px; }
  .card h3 { margin: 0 0 2px; font-size: 15px; } .card .file { color: var(--faint); font-size: 12px; margin-bottom: 8px; }
  .card ol { margin: 0; padding-left: 0; list-style: none; font-size: 13px; color: #cfcfd4; }
  .card li { display: flex; gap: 10px; padding: 2px 0; } .card li b { color: var(--accent); width: 34px; flex: none; font-weight: 600; }
  .card.live { border-color: var(--accent); }
  .tag { display: inline-block; font-size: 11px; background: var(--accent); border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
</style>
</head>
<body>
<div class="page">
  <h1>File Flier: showcase storyboard</h1>
  <p class="lede">Ten 5-second clips for the README. Above: the Quick Look pilot as the recorder captures it (1280 × 800; open
    <code>scene.html?s=04-quick-look</code> to scrub). Below: each scene's beats.</p>
  <iframe src="scene.html?s=04-quick-look" title="Quick Look scene"></iframe>
  <div class="grid" id="cards"></div>
</div>
<script>
const SCENES = [
  { n: 1, title: "Split tabs and tiling", file: "01-split-tabs.gif", beats: [["0.0", "One pane, Videos tab"], ["0.6", "Drag the Pictures tab to the right edge, drop zone glows"], ["1.6", "Panes split side by side"], ["2.4", "Drag Downloads tab to the bottom of the right pane"], ["3.4", "Three panes tiled"], ["4.2", "Click into each pane, active outline moves"]] },
  { n: 2, title: "Type to filter, command palette", file: "02-filter-palette.gif", beats: [["0.0", "Type “sun”, the list narrows instantly"], ["1.4", "Esc clears"], ["1.9", "Ctrl+Shift+P opens the palette"], ["2.4", "Type “grid”, fuzzy matches with shortcuts"], ["3.6", "Enter, the view switches to Large grid"]] },
  { n: 3, title: "Views for every job", file: "03-views.gif", beats: [["0.0", "Details"], ["1.0", "Alt+3 tree, folders expand"], ["2.0", "Alt+4 columns strip scrolls sideways"], ["3.2", "Alt+7 large grid with thumbnails"], ["4.2", "Back to details"]] },
  { n: 4, title: "Quick Look plays video", file: "04-quick-look.gif", live: true, beats: [["0.0", "Pointer moves to Lisbon sunset.mp4, click"], ["1.1", "Space opens Quick Look, video plays"], ["2.55", "K pauses"], ["3.15", "L skips +5 s"], ["3.75", "K plays"], ["4.35", "Space closes"]] },
  { n: 5, title: "Inspector on any side", file: "05-inspector.gif", beats: [["0.0", "Inspector right with a code file, line numbers"], ["1.2", "Ctrl+Shift+I moves it to the bottom band"], ["2.2", "Again: left; again: top"], ["3.4", "Drag the preview/details divider"], ["4.2", "Click play, music file plays in the panel"]] },
  { n: 6, title: "Multi-select canvas", file: "06-canvas.gif", beats: [["0.0", "Grid of photos"], ["0.6", "Ctrl+A, the inspector becomes a canvas"], ["1.4", "Space: Quick Look canvas with all of them"], ["2.2", "Scroll to zoom in around the pointer, drag to pan"], ["3.6", "Hover a photo, click 4 stars"], ["4.4", "Double-click empty space, fits again"]] },
  { n: 7, title: "Ratings and tags", file: "07-ratings-tags.gif", beats: [["0.0", "Grid view"], ["0.5", "Hold Alt, hover a tile, stars appear; click 5"], ["1.6", "Right-click, Tags, pick “Client work”"], ["2.8", "Tag dot on the tile"], ["3.4", "Click the tag in the sidebar, everything tagged"]] },
  { n: 8, title: "Group by date", file: "08-grouping.gif", beats: [["0.0", "Downloads, flat list"], ["0.8", "Ctrl+G: Today, Yesterday, This week, This month…"], ["2.4", "Arrow down skips over headers"], ["3.4", "Ctrl+G again: by name A, B, C…"], ["4.4", "Remembered for this folder"]] },
  { n: 9, title: "Looks: GNOME, colours, glass", file: "09-themes.gif", beats: [["0.0", "GNOME Dark"], ["0.8", "Settings, theme cards: GNOME Light"], ["1.8", "Nord, Gruvbox"], ["2.8", "Right-click folder, colour it red"], ["3.6", "Frosted glass on"]] },
  { n: 10, title: "Batch rename", file: "10-batch-rename.gif", beats: [["0.0", "Select 6 photos"], ["0.6", "F2: batch rename dialog"], ["1.4", "Template “Lisbon {n:02}”, live preview column"], ["3.0", "Rename, names update"], ["3.8", "Ctrl+Z undoes it"]] },
];
document.getElementById("cards").innerHTML = SCENES.map(s => `<div class="card${s.live ? " live" : ""}">
  <h3>${s.n}. ${s.title}${s.live ? '<span class="tag">pilot, animated above</span>' : ""}</h3><div class="file">docs/media/${s.file} · 5 s</div>
  <ol>${s.beats.map(([t, b]) => `<li><b>${t}</b>${b}</li>`).join("")}</ol></div>`).join("");
</script>
</body>
</html>
